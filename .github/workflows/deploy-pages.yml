# -----------------------------------------------------------------------------
# Publish the static Path Frequency app in dist/ to GitHub Pages.
# The source code stays organised in its current folders; only dist/ is served.
# -----------------------------------------------------------------------------
name: Deploy Path Frequency to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the application folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy the application
        id: deployment
        uses: actions/deploy-pages@v4
